# ADC-IMPLEMENTS: <dnd-impl-sync-worker-04>
# dnd-sync — room server for the D&D tabletop (contracts/ADC_006_DND_TABLETOP.md).
# One Durable Object instance per room code; free-plan friendly (SQLite-backed
# DO + WebSocket hibernation). Deploy: `npx wrangler deploy` from this directory
# (owner's personal Cloudflare account).

name = "dnd-sync"
main = "src/index.js"
compatibility_date = "2026-07-01"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "TableRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TableRoom"]
