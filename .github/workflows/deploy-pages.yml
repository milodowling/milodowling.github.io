# Deploys the Astro build to GitHub Pages on push to main.
# See <dnd-ref-deploy-01> in contracts/ADC_006_DND_TABLETOP.md and the
# website corpus DECISIONS entry 2026-07-10 (deploy path = Actions → Pages).
#
# One-time setup (repo Settings → Pages): set Source to "GitHub Actions".
# The dnd-sync Worker deploys separately via `npm run sync:deploy`.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # npm 11 (bundled with Node 24) — must match the npm generation
          # that writes package-lock.json locally, or `npm ci` rejects the
          # nested-optional-deps layout (wrangler's bundled esbuild).
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          R2_PUBLIC_BASE: https://media.milodowling.com
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
