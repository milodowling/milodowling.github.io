<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>D&D Tabletop</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0d0d1a;
      color: #e8dcc4;
      height: 100vh;
      overflow: hidden;
    }

    .app {
      display: flex;
      height: 100vh;
      gap: 0;
    }

    /* Canvas Area */
    .canvas-container {
      flex: 1;
      position: relative;
      background: #1a1a2e;
      border-right: 3px solid #2a2a4e;
    }

    #mainCanvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Sidebar */
    .sidebar {
      width: 200px;
      background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%);
      display: flex;
      flex-direction: column;
      border-left: 1px solid #c9a95933;
    }

    .sidebar-section {
      padding: 12px;
      border-bottom: 1px solid #c9a95933;
    }

    .sidebar-section h3 {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #c9a959;
      margin-bottom: 10px;
      font-weight: 600;
    }

    /* Mode Buttons */
    .mode-buttons {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .mode-btn {
      background: #2a2a4e;
      border: 1px solid #3a3a5e;
      color: #e8dcc4;
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      text-align: left;
      transition: all 0.15s ease;
    }

    .mode-btn:hover {
      background: #3a3a5e;
      border-color: #c9a959;
    }

    .mode-btn.active {
      background: #c9a959;
      color: #1a1a2e;
      border-color: #d4a574;
      font-weight: 600;
    }

    .clear-btn {
      background: #4a2a2a;
      border-color: #6a3a3a;
      margin-top: 6px;
    }

    .clear-btn:hover {
      background: #6a3a3a;
      border-color: #8a4a4a;
    }

    /* Draw Settings */
    .draw-settings {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #3a3a5e;
    }

    .draw-colors {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
    }

    .color-swatch {
      width: 28px;
      height: 28px;
      border-radius: 4px;
      cursor: pointer;
      border: 2px solid #3a3a5e;
      transition: all 0.15s ease;
    }

    .color-swatch:hover {
      border-color: #c9a959;
      transform: scale(1.1);
    }

    .color-swatch.active {
      border-color: #c9a959;
      box-shadow: 0 0 8px #c9a95966;
    }

    .draw-thickness {
      display: flex;
      gap: 4px;
    }

    .thickness-btn {
      flex: 1;
      background: #2a2a4e;
      border: 1px solid #3a3a5e;
      color: #a89a7a;
      padding: 4px 6px;
      border-radius: 3px;
      cursor: pointer;
      font-size: 11px;
      transition: all 0.15s ease;
    }

    .thickness-btn:hover {
      border-color: #c9a959;
    }

    .thickness-btn.active {
      background: #3a4a5e;
      border-color: #c9a959;
      color: #e8dcc4;
    }

    .draw-hint {
      margin-top: 8px;
      font-size: 10px;
      color: #6a6a8a;
      font-style: italic;
    }

    /* Upload Buttons */
    .upload-btn {
      background: linear-gradient(180deg, #2a3a4e 0%, #1a2a3e 100%);
      border: 1px solid #c9a95966;
      color: #e8dcc4;
      padding: 10px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      width: 100%;
      transition: all 0.15s ease;
    }

    .upload-btn:hover {
      background: linear-gradient(180deg, #3a4a5e 0%, #2a3a4e 100%);
      border-color: #c9a959;
    }

    /* Icon Library */
    .icon-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .icon-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 8px;
      padding-right: 4px;
    }

    .icon-list::-webkit-scrollbar {
      width: 6px;
    }

    .icon-list::-webkit-scrollbar-track {
      background: #1a1a2e;
    }

    .icon-list::-webkit-scrollbar-thumb {
      background: #c9a95966;
      border-radius: 3px;
    }

    .icon-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px;
      background: #2a2a4e;
      border: 1px solid #3a3a5e;
      border-radius: 4px;
      cursor: grab;
      transition: all 0.15s ease;
      user-select: none;
    }

    .icon-item:hover {
      border-color: #c9a959;
    }

    .icon-item:active {
      cursor: grabbing;
    }

    .icon-item.dragging {
      opacity: 0.5;
    }

    .icon-item img {
      width: 32px;
      height: 32px;
      object-fit: contain;
      border-radius: 2px;
    }

    .icon-item span {
      font-size: 12px;
      color: #a89a7a;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .icon-delete {
      background: none;
      border: none;
      color: #6a4a4a;
      cursor: pointer;
      padding: 2px 6px;
      font-size: 14px;
      border-radius: 2px;
    }

    .icon-delete:hover {
      color: #aa6a6a;
      background: #3a2a2a;
    }

    /* Hidden inputs */
    .hidden {
      display: none;
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 20px 10px;
      color: #6a6a8a;
      font-size: 12px;
      font-style: italic;
    }

    /* Canvas cursors */
    .cursor-crosshair { cursor: crosshair; }
    .cursor-move { cursor: move; }
    .cursor-pointer { cursor: pointer; }
    .cursor-grab { cursor: grab; }
    .cursor-grabbing { cursor: grabbing; }
  </style>
</head>
<body>
  <div class="app">
    <div class="canvas-container">
      <canvas id="mainCanvas"></canvas>
    </div>

    <div class="sidebar">
      <div class="sidebar-section">
        <h3>Mode</h3>
        <div class="mode-buttons">
          <button class="mode-btn active" data-mode="draw">Draw</button>
          <button class="mode-btn" data-mode="erase">Erase</button>
          <button class="mode-btn clear-btn" id="clearDrawings">Clear</button>
        </div>
        <div class="draw-settings" id="drawSettings">
          <div class="draw-colors">
            <div class="color-swatch active" data-color="#cc3333" style="background:#cc3333"></div>
            <div class="color-swatch" data-color="#3366cc" style="background:#3366cc"></div>
            <div class="color-swatch" data-color="#33aa33" style="background:#33aa33"></div>
            <div class="color-swatch" data-color="#ccaa33" style="background:#ccaa33"></div>
            <div class="color-swatch" data-color="#ffffff" style="background:#ffffff"></div>
          </div>
          <div class="draw-thickness">
            <button class="thickness-btn" data-width="2">Thin</button>
            <button class="thickness-btn active" data-width="4">Med</button>
            <button class="thickness-btn" data-width="8">Thick</button>
          </div>
          <div class="draw-hint">Hold Shift for straight lines</div>
        </div>
      </div>

      <div class="sidebar-section">
        <h3>Backdrop</h3>
        <button class="upload-btn" id="backdropBtn">Upload Backdrop</button>
        <input type="file" id="backdropInput" class="hidden" accept="image/png,image/jpeg">
      </div>

      <div class="sidebar-section icon-section">
        <h3>Icons</h3>
        <button class="upload-btn" id="iconBtn">+ Add Icon</button>
        <input type="file" id="iconInput" class="hidden" accept="image/png" multiple>
        <div class="icon-list" id="iconList">
          <div class="empty-state">No icons yet</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ============ STATE ============
    const state = {
      backdrop: null,
      iconLibrary: [],
      placedIcons: [],
      drawings: [],
      mode: 'draw',
      // Icon interaction (canvas)
      hoveredIcon: null,
      draggingPlacedIcon: null,
      resizingPlacedIcon: null,
      dragOffset: { x: 0, y: 0 },
      resizeHandle: null,
      // Drawing
      isDrawing: false,
      currentPath: null,
      drawColor: '#cc3333',
      drawWidth: 4,
      shiftHeld: false,
      // Drag from sidebar
      dragFromSidebar: null
    };

    // Image cache
    const imageCache = new Map();

    // ============ DOM ELEMENTS ============
    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');
    const canvasContainer = document.querySelector('.canvas-container');
    const modeButtons = document.querySelectorAll('.mode-btn[data-mode]');
    const clearBtn = document.getElementById('clearDrawings');
    const backdropBtn = document.getElementById('backdropBtn');
    const backdropInput = document.getElementById('backdropInput');
    const iconBtn = document.getElementById('iconBtn');
    const iconInput = document.getElementById('iconInput');
    const iconList = document.getElementById('iconList');
    const drawSettings = document.getElementById('drawSettings');
    const colorSwatches = document.querySelectorAll('.color-swatch');
    const thicknessButtons = document.querySelectorAll('.thickness-btn');

    // ============ CANVAS SETUP ============
    function resizeCanvas() {
      const rect = canvasContainer.getBoundingClientRect();
      canvas.width = rect.width;
      canvas.height = rect.height;
      render();
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // ============ RENDERING ============
    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Draw backdrop
      if (state.backdrop) {
        const img = imageCache.get(state.backdrop);
        if (img) {
          const scale = Math.min(canvas.width / img.width, canvas.height / img.height);
          const w = img.width * scale;
          const h = img.height * scale;
          const x = (canvas.width - w) / 2;
          const y = (canvas.height - h) / 2;
          ctx.drawImage(img, x, y, w, h);
        }
      }

      // Draw placed icons
      state.placedIcons.forEach(icon => {
        const img = imageCache.get(state.iconLibrary[icon.imageIndex]);
        if (img) {
          ctx.drawImage(img, icon.x, icon.y, icon.width, icon.height);

          // Draw selection outline when hovering, dragging or resizing this icon
          const isActive = state.hoveredIcon === icon.id || state.draggingPlacedIcon === icon.id || state.resizingPlacedIcon === icon.id;
          if (isActive) {
            ctx.strokeStyle = '#c9a959';
            ctx.lineWidth = 2;
            ctx.setLineDash([5, 5]);
            ctx.strokeRect(icon.x - 2, icon.y - 2, icon.width + 4, icon.height + 4);
            ctx.setLineDash([]);

            // Draw resize handles
            const handleSize = 8;
            ctx.fillStyle = '#c9a959';
            ctx.fillRect(icon.x - handleSize/2, icon.y - handleSize/2, handleSize, handleSize);
            ctx.fillRect(icon.x + icon.width - handleSize/2, icon.y - handleSize/2, handleSize, handleSize);
            ctx.fillRect(icon.x - handleSize/2, icon.y + icon.height - handleSize/2, handleSize, handleSize);
            ctx.fillRect(icon.x + icon.width - handleSize/2, icon.y + icon.height - handleSize/2, handleSize, handleSize);

            // Delete button (inside top-right corner)
            const delX = icon.x + icon.width - 12;
            const delY = icon.y + 12;
            ctx.fillStyle = '#aa4444';
            ctx.beginPath();
            ctx.arc(delX, delY, 10, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 14px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('×', delX, delY);
          }
        }
      });

      // Draw paths
      state.drawings.forEach(path => {
        if (path.points.length < 2) return;
        ctx.strokeStyle = path.color;
        ctx.lineWidth = path.width;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.beginPath();
        ctx.moveTo(path.points[0].x, path.points[0].y);
        for (let i = 1; i < path.points.length; i++) {
          ctx.lineTo(path.points[i].x, path.points[i].y);
        }
        ctx.stroke();
      });

      // Draw current path
      if (state.currentPath && state.currentPath.points.length >= 2) {
        ctx.strokeStyle = state.currentPath.color;
        ctx.lineWidth = state.currentPath.width;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.beginPath();
        ctx.moveTo(state.currentPath.points[0].x, state.currentPath.points[0].y);
        for (let i = 1; i < state.currentPath.points.length; i++) {
          ctx.lineTo(state.currentPath.points[i].x, state.currentPath.points[i].y);
        }
        ctx.stroke();
      }
    }

    // ============ IMAGE LOADING ============
    function loadImage(dataUrl) {
      return new Promise((resolve) => {
        if (imageCache.has(dataUrl)) {
          resolve(imageCache.get(dataUrl));
          return;
        }
        const img = new Image();
        img.onload = () => {
          imageCache.set(dataUrl, img);
          resolve(img);
        };
        img.src = dataUrl;
      });
    }

    // ============ REMOVE BACKGROUND AND TRIM ============
    function removeBackgroundAndTrim(dataUrl) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => {
          const tempCanvas = document.createElement('canvas');
          const tempCtx = tempCanvas.getContext('2d');
          tempCanvas.width = img.width;
          tempCanvas.height = img.height;
          tempCtx.drawImage(img, 0, 0);

          const imageData = tempCtx.getImageData(0, 0, img.width, img.height);
          const data = imageData.data;

          // Sample corner pixels to detect background color
          const corners = [
            0, // top-left
            (img.width - 1) * 4, // top-right
            (img.height - 1) * img.width * 4, // bottom-left
            ((img.height - 1) * img.width + (img.width - 1)) * 4 // bottom-right
          ];

          const cornerColors = corners.map(idx => ({
            r: data[idx],
            g: data[idx + 1],
            b: data[idx + 2],
            a: data[idx + 3]
          }));

          // Check if corners are similar (potential background)
          function colorsMatch(c1, c2, tolerance = 30) {
            return Math.abs(c1.r - c2.r) <= tolerance &&
                   Math.abs(c1.g - c2.g) <= tolerance &&
                   Math.abs(c1.b - c2.b) <= tolerance &&
                   c1.a > 200 && c2.a > 200; // both opaque
          }

          // Find dominant corner color (appears in 3+ corners)
          let bgColor = null;
          for (let i = 0; i < 4; i++) {
            let matches = 1;
            for (let j = 0; j < 4; j++) {
              if (i !== j && colorsMatch(cornerColors[i], cornerColors[j])) {
                matches++;
              }
            }
            if (matches >= 3) {
              bgColor = cornerColors[i];
              break;
            }
          }

          // If background detected, make matching pixels transparent
          if (bgColor) {
            const tolerance = 40;
            for (let i = 0; i < data.length; i += 4) {
              const r = data[i];
              const g = data[i + 1];
              const b = data[i + 2];

              if (Math.abs(r - bgColor.r) <= tolerance &&
                  Math.abs(g - bgColor.g) <= tolerance &&
                  Math.abs(b - bgColor.b) <= tolerance) {
                data[i + 3] = 0; // Set alpha to 0
              }
            }
            tempCtx.putImageData(imageData, 0, 0);
          }

          // Now find bounding box of non-transparent pixels
          let minX = img.width, minY = img.height, maxX = 0, maxY = 0;
          let hasContent = false;

          for (let y = 0; y < img.height; y++) {
            for (let x = 0; x < img.width; x++) {
              const alpha = data[(y * img.width + x) * 4 + 3];
              if (alpha > 10) {
                hasContent = true;
                if (x < minX) minX = x;
                if (x > maxX) maxX = x;
                if (y < minY) minY = y;
                if (y > maxY) maxY = y;
              }
            }
          }

          // If no content, return original
          if (!hasContent) {
            resolve(dataUrl);
            return;
          }

          // Add 1px padding
          const padding = 1;
          minX = Math.max(0, minX - padding);
          minY = Math.max(0, minY - padding);
          maxX = Math.min(img.width - 1, maxX + padding);
          maxY = Math.min(img.height - 1, maxY + padding);

          const cropWidth = maxX - minX + 1;
          const cropHeight = maxY - minY + 1;

          // Create cropped canvas
          const cropCanvas = document.createElement('canvas');
          const cropCtx = cropCanvas.getContext('2d');
          cropCanvas.width = cropWidth;
          cropCanvas.height = cropHeight;
          cropCtx.drawImage(tempCanvas, minX, minY, cropWidth, cropHeight, 0, 0, cropWidth, cropHeight);

          resolve(cropCanvas.toDataURL('image/png'));
        };
        img.src = dataUrl;
      });
    }

    // ============ MODE SWITCHING ============
    modeButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        state.mode = btn.dataset.mode;
        modeButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        updateDrawSettingsVisibility();
        updateCursor();
        render();
      });
    });

    function updateDrawSettingsVisibility() {
      drawSettings.style.display = state.mode === 'draw' ? 'block' : 'none';
    }

    function updateCursor() {
      canvas.className = '';
      if (state.mode === 'draw' || state.mode === 'erase') {
        canvas.classList.add('cursor-crosshair');
      } else {
        canvas.classList.add('cursor-pointer');
      }
    }

    // ============ DRAW SETTINGS ============
    colorSwatches.forEach(swatch => {
      swatch.addEventListener('click', () => {
        colorSwatches.forEach(s => s.classList.remove('active'));
        swatch.classList.add('active');
        state.drawColor = swatch.dataset.color;
      });
    });

    thicknessButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        thicknessButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        state.drawWidth = parseInt(btn.dataset.width);
      });
    });

    // Shift key tracking
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Shift') state.shiftHeld = true;
    });
    document.addEventListener('keyup', (e) => {
      if (e.key === 'Shift') state.shiftHeld = false;
    });

    // ============ BACKDROP ============
    backdropBtn.addEventListener('click', () => backdropInput.click());

    backdropInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = async (event) => {
        state.backdrop = event.target.result;
        await loadImage(state.backdrop);
        render();
        saveState();
      };
      reader.readAsDataURL(file);
      e.target.value = '';
    });

    // ============ ICON LIBRARY ============
    iconBtn.addEventListener('click', () => iconInput.click());

    iconInput.addEventListener('change', (e) => {
      const files = Array.from(e.target.files);
      files.forEach(file => {
        const reader = new FileReader();
        reader.onload = async (event) => {
          // Remove background and trim PNG icons
          const processedDataUrl = await removeBackgroundAndTrim(event.target.result);
          state.iconLibrary.push(processedDataUrl);
          await loadImage(processedDataUrl);
          renderIconList();
          saveState();
        };
        reader.readAsDataURL(file);
      });
      e.target.value = '';
    });

    function renderIconList() {
      if (state.iconLibrary.length === 0) {
        iconList.innerHTML = '<div class="empty-state">No icons yet. Drag icons onto the map.</div>';
        return;
      }

      iconList.innerHTML = state.iconLibrary.map((icon, index) => `
        <div class="icon-item" data-index="${index}" draggable="true">
          <img src="${icon}" alt="Icon ${index + 1}" draggable="false">
          <span>Icon ${index + 1}</span>
          <button class="icon-delete" data-delete="${index}">×</button>
        </div>
      `).join('');

      // Drag from sidebar (mouse)
      iconList.querySelectorAll('.icon-item').forEach(item => {
        item.addEventListener('dragstart', (e) => {
          const index = parseInt(item.dataset.index);
          state.dragFromSidebar = index;
          item.classList.add('dragging');
          e.dataTransfer.effectAllowed = 'copy';
          e.dataTransfer.setData('text/plain', index.toString());
        });

        item.addEventListener('dragend', () => {
          item.classList.remove('dragging');
          state.dragFromSidebar = null;
        });

        // Touch drag from sidebar
        item.addEventListener('touchstart', (e) => {
          const index = parseInt(item.dataset.index);
          state.dragFromSidebar = index;
          state.touchDragStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
          item.classList.add('dragging');
        }, { passive: true });

        item.addEventListener('touchmove', (e) => {
          if (state.dragFromSidebar === null) return;
          e.preventDefault();
          // Visual feedback could be added here
        }, { passive: false });

        item.addEventListener('touchend', (e) => {
          if (state.dragFromSidebar === null) return;
          item.classList.remove('dragging');

          const touch = e.changedTouches[0];
          const rect = canvas.getBoundingClientRect();

          // Check if touch ended over canvas
          if (touch.clientX >= rect.left && touch.clientX <= rect.right &&
              touch.clientY >= rect.top && touch.clientY <= rect.bottom) {
            const x = touch.clientX - rect.left;
            const y = touch.clientY - rect.top;

            const img = imageCache.get(state.iconLibrary[state.dragFromSidebar]);
            if (img) {
              const size = Math.min(64, img.width, img.height);
              const scale = size / Math.max(img.width, img.height);
              state.placedIcons.push({
                id: Date.now(),
                imageIndex: state.dragFromSidebar,
                x: x - (img.width * scale) / 2,
                y: y - (img.height * scale) / 2,
                width: img.width * scale,
                height: img.height * scale
              });
              render();
              saveState();
            }
          }

          state.dragFromSidebar = null;
        });
      });

      // Delete buttons
      iconList.querySelectorAll('.icon-delete').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          e.preventDefault();
          const index = parseInt(btn.dataset.delete);
          // Remove from library
          state.iconLibrary.splice(index, 1);
          // Update placed icons
          state.placedIcons = state.placedIcons.filter(icon => icon.imageIndex !== index);
          state.placedIcons.forEach(icon => {
            if (icon.imageIndex > index) icon.imageIndex--;
          });
          renderIconList();
          render();
          saveState();
        });
      });
    }

    // Canvas drop zone for icons
    canvas.addEventListener('dragover', (e) => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'copy';
    });

    canvas.addEventListener('drop', (e) => {
      e.preventDefault();
      if (state.dragFromSidebar === null) return;

      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      const img = imageCache.get(state.iconLibrary[state.dragFromSidebar]);
      if (img) {
        const size = Math.min(64, img.width, img.height);
        const scale = size / Math.max(img.width, img.height);
        state.placedIcons.push({
          id: Date.now(),
          imageIndex: state.dragFromSidebar,
          x: x - (img.width * scale) / 2,
          y: y - (img.height * scale) / 2,
          width: img.width * scale,
          height: img.height * scale
        });
        render();
        saveState();
      }
      state.dragFromSidebar = null;
    });

    // ============ CANVAS INTERACTION ============
    function getMousePos(e) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: e.clientX - rect.left,
        y: e.clientY - rect.top
      };
    }

    function getTouchPos(e) {
      const rect = canvas.getBoundingClientRect();
      const touch = e.touches[0] || e.changedTouches[0];
      return {
        x: touch.clientX - rect.left,
        y: touch.clientY - rect.top
      };
    }

    function getIconAt(x, y) {
      // Check in reverse order (top icons first)
      for (let i = state.placedIcons.length - 1; i >= 0; i--) {
        const icon = state.placedIcons[i];
        if (x >= icon.x && x <= icon.x + icon.width &&
            y >= icon.y && y <= icon.y + icon.height) {
          return icon;
        }
      }
      return null;
    }

    function getResizeHandle(x, y, icon) {
      if (!icon) return null;
      const handleSize = 12;
      const handles = [
        { name: 'nw', x: icon.x, y: icon.y },
        { name: 'ne', x: icon.x + icon.width, y: icon.y },
        { name: 'sw', x: icon.x, y: icon.y + icon.height },
        { name: 'se', x: icon.x + icon.width, y: icon.y + icon.height }
      ];

      for (const handle of handles) {
        if (Math.abs(x - handle.x) < handleSize && Math.abs(y - handle.y) < handleSize) {
          return handle.name;
        }
      }
      return null;
    }

    function isOnDeleteButton(x, y, icon) {
      if (!icon) return false;
      const btnX = icon.x + icon.width - 12;
      const btnY = icon.y + 12;
      return Math.sqrt((x - btnX) ** 2 + (y - btnY) ** 2) <= 12;
    }

    let mouseIsDown = false;

    canvas.addEventListener('mousedown', (e) => {
      mouseIsDown = true;
      const pos = getMousePos(e);
      handlePointerDown(pos);
    });

    canvas.addEventListener('mousemove', (e) => {
      const pos = getMousePos(e);
      // Only process drawing if mouse is actually held down
      if (state.isDrawing && !mouseIsDown) {
        // Mouse was released outside - clean up
        state.isDrawing = false;
        state.currentPath = null;
        render();
        return;
      }
      handlePointerMove(pos);
    });

    function handlePointerUp() {
      mouseIsDown = false;

      // Icon drop
      if (state.draggingPlacedIcon !== null || state.resizingPlacedIcon !== null) {
        state.draggingPlacedIcon = null;
        state.resizingPlacedIcon = null;
        render();
        saveState();
      }

      // Drawing complete - ALWAYS clear drawing state
      if (state.isDrawing || state.currentPath) {
        if (state.mode === 'draw' && state.currentPath && state.currentPath.points.length >= 2) {
          // If shift held, make it a straight line
          if (state.shiftHeld) {
            const first = state.currentPath.points[0];
            const last = state.currentPath.points[state.currentPath.points.length - 1];
            state.currentPath.points = [first, last];
          }
          state.drawings.push(state.currentPath);
          saveState();
        }
        if (state.mode === 'erase' && state.isDrawing) {
          saveState();
        }
        state.currentPath = null;
        state.isDrawing = false;
        render();
      }
    }

    canvas.addEventListener('mouseup', handlePointerUp);
    window.addEventListener('mouseup', handlePointerUp);

    canvas.addEventListener('mouseleave', () => {
      // Clear hover
      if (state.hoveredIcon !== null) {
        state.hoveredIcon = null;
        render();
      }

      if (state.isDrawing && state.mode === 'draw') {
        if (state.currentPath && state.currentPath.points.length >= 2) {
          if (state.shiftHeld) {
            const first = state.currentPath.points[0];
            const last = state.currentPath.points[state.currentPath.points.length - 1];
            state.currentPath.points = [first, last];
          }
          state.drawings.push(state.currentPath);
          saveState();
        }
        state.currentPath = null;
        state.isDrawing = false;
        render();
      }
      // Don't drop icons on mouse leave - keep dragging
    });

    function eraseAt(x, y) {
      const eraseRadius = 20;
      state.drawings = state.drawings.filter(path => {
        return !path.points.some(point =>
          Math.sqrt((point.x - x) ** 2 + (point.y - y) ** 2) < eraseRadius
        );
      });
      render();
    }

    // ============ TOUCH EVENTS ============
    function handlePointerDown(pos) {
      // Check hovered icon for delete button click
      if (state.hoveredIcon !== null) {
        const hoveredIconObj = state.placedIcons.find(i => i.id === state.hoveredIcon);
        if (hoveredIconObj && isOnDeleteButton(pos.x, pos.y, hoveredIconObj)) {
          state.placedIcons = state.placedIcons.filter(i => i.id !== state.hoveredIcon);
          state.hoveredIcon = null;
          render();
          saveState();
          return true;
        }

        // Check resize handles on hovered icon
        const handle = getResizeHandle(pos.x, pos.y, hoveredIconObj);
        if (handle) {
          state.resizingPlacedIcon = hoveredIconObj.id;
          state.resizeHandle = handle;
          state.dragOffset = { x: pos.x, y: pos.y };
          const index = state.placedIcons.findIndex(i => i.id === hoveredIconObj.id);
          state.placedIcons.push(state.placedIcons.splice(index, 1)[0]);
          render();
          return true;
        }
      }

      // Check if clicking on an icon to drag
      const clickedIcon = getIconAt(pos.x, pos.y);
      if (clickedIcon) {
        state.draggingPlacedIcon = clickedIcon.id;
        state.hoveredIcon = clickedIcon.id;
        state.dragOffset = {
          x: pos.x - clickedIcon.x,
          y: pos.y - clickedIcon.y
        };
        const index = state.placedIcons.findIndex(i => i.id === clickedIcon.id);
        state.placedIcons.push(state.placedIcons.splice(index, 1)[0]);
        render();
        return true;
      }

      // Mode-specific actions
      if (state.mode === 'draw') {
        state.isDrawing = true;
        state.currentPath = {
          points: [pos],
          color: state.drawColor,
          width: state.drawWidth
        };
        return true;
      }

      if (state.mode === 'erase') {
        state.isDrawing = true;
        eraseAt(pos.x, pos.y);
        return true;
      }

      return false;
    }

    function handlePointerMove(pos) {
      // Icon dragging
      if (state.draggingPlacedIcon !== null) {
        const icon = state.placedIcons.find(i => i.id === state.draggingPlacedIcon);
        if (icon) {
          icon.x = pos.x - state.dragOffset.x;
          icon.y = pos.y - state.dragOffset.y;
          render();
        }
        return;
      }

      // Icon resizing
      if (state.resizingPlacedIcon !== null) {
        const icon = state.placedIcons.find(i => i.id === state.resizingPlacedIcon);
        if (icon) {
          const dx = pos.x - state.dragOffset.x;
          const dy = pos.y - state.dragOffset.y;
          const minSize = 20;

          if (state.resizeHandle.includes('e')) {
            icon.width = Math.max(minSize, icon.width + dx);
          }
          if (state.resizeHandle.includes('w')) {
            const newWidth = Math.max(minSize, icon.width - dx);
            icon.x += icon.width - newWidth;
            icon.width = newWidth;
          }
          if (state.resizeHandle.includes('s')) {
            icon.height = Math.max(minSize, icon.height + dy);
          }
          if (state.resizeHandle.includes('n')) {
            const newHeight = Math.max(minSize, icon.height - dy);
            icon.y += icon.height - newHeight;
            icon.height = newHeight;
          }

          state.dragOffset = { x: pos.x, y: pos.y };
          render();
        }
        return;
      }

      // Drawing
      if (state.isDrawing) {
        if (state.mode === 'draw' && state.currentPath) {
          state.currentPath.points.push(pos);
          render();
          return;
        }

        if (state.mode === 'erase') {
          eraseAt(pos.x, pos.y);
          return;
        }
      }

      // Hover detection for icons
      const hoveredIcon = getIconAt(pos.x, pos.y);
      const newHoveredId = hoveredIcon ? hoveredIcon.id : null;
      if (state.hoveredIcon !== newHoveredId) {
        state.hoveredIcon = newHoveredId;
        render();
      }
    }

    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      const pos = getTouchPos(e);
      // Set hover for touch (since no mousemove before touch)
      const touchedIcon = getIconAt(pos.x, pos.y);
      if (touchedIcon) {
        state.hoveredIcon = touchedIcon.id;
        render();
      }
      handlePointerDown(pos);
    }, { passive: false });

    canvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      const pos = getTouchPos(e);
      handlePointerMove(pos);
    }, { passive: false });

    canvas.addEventListener('touchend', (e) => {
      e.preventDefault();
      handlePointerUp();
    }, { passive: false });

    canvas.addEventListener('touchcancel', (e) => {
      e.preventDefault();
      handlePointerUp();
    }, { passive: false });

    window.addEventListener('touchend', handlePointerUp);

    // ============ CLEAR DRAWINGS ============
    clearBtn.addEventListener('click', () => {
      if (state.drawings.length === 0) return;
      state.drawings = [];
      render();
      saveState();
    });

    // ============ PERSISTENCE ============
    function saveState() {
      const data = {
        backdrop: state.backdrop,
        iconLibrary: state.iconLibrary,
        placedIcons: state.placedIcons,
        drawings: state.drawings
      };
      localStorage.setItem('dndTabletop', JSON.stringify(data));
    }

    async function loadState() {
      const saved = localStorage.getItem('dndTabletop');
      if (!saved) return;

      try {
        const data = JSON.parse(saved);
        state.backdrop = data.backdrop || null;
        state.iconLibrary = data.iconLibrary || [];
        state.placedIcons = data.placedIcons || [];
        state.drawings = data.drawings || [];

        // Load images
        if (state.backdrop) {
          await loadImage(state.backdrop);
        }
        for (const icon of state.iconLibrary) {
          await loadImage(icon);
        }

        renderIconList();
        render();
      } catch (e) {
        console.error('Failed to load saved state:', e);
      }
    }

    // ============ INIT ============
    loadState();
    updateCursor();
    updateDrawSettingsVisibility();
  </script>
</body>
</html>
